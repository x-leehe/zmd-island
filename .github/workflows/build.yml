name: Build Windows Installer

# CI（push / PR）：只构建并上传 Artifact —— 安装器 + 便携版 zip，外部插件已包在包里。
# Release：**不随标签自动发布**，必须手动触发本工作流：
#   Actions 页面 → 本工作流 → Run workflow → 选中要发布的 v* 标签 → 勾选 publish_release。
# 只有「手动触发 + publish_release 为真 + 运行在 v* 标签上」三者同时满足才创建 Release。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '创建 GitHub Release（必须运行在 v* 标签上）'
        type: boolean
        default: false

permissions:
  contents: write   # 手动发布 Release 时需要

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # ---- 版本号：tag 用 tag 名，否则用 0.0.<run_number> ----
    # 必须在 build 之前解析：程序集版本参与编译，应用内「检查更新」靠它比较
    - name: Resolve version
      id: ver
      shell: pwsh
      run: |
        $wantRelease = "${{ inputs.publish_release }}" -eq "true"
        if ($env:GITHUB_REF -like 'refs/tags/v*') {
          $v = $env:GITHUB_REF -replace 'refs/tags/v', ''
        } else {
          if ($wantRelease) {
            Write-Error "publish_release 需要运行在 v* 标签上（当前 $env:GITHUB_REF）"
            exit 1
          }
          $v = "0.0.$env:GITHUB_RUN_NUMBER"
        }
        "version=$v" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $v"

    - name: Restore
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build -c Release --no-restore /p:TreatWarningsAsErrors=true /p:Version=${{ steps.ver.outputs.version }}

    - name: Test
      run: dotnet test tests/EndfieldCharge.Tests/EndfieldCharge.Tests.csproj -c Debug -v minimal

    # 格式基线：5 个工程都必须与 .editorconfig 一致（以 dotnet format 报告为准）
    - name: Format check
      shell: pwsh
      run: |
        $projects = @(
          "EndfieldCharge.csproj",
          "src/EndfieldCharge.Contracts/EndfieldCharge.Contracts.csproj",
          "src/EndfieldCharge.Contracts.Avalonia/EndfieldCharge.Contracts.Avalonia.csproj",
          "plugins/EndfieldCharge.Plugin.Template/EndfieldCharge.Plugin.Template.csproj",
          "tests/EndfieldCharge.Tests/EndfieldCharge.Tests.csproj"
        )
        foreach ($p in $projects) {
          Write-Host "dotnet format --verify-no-changes $p"
          dotnet format $p --verify-no-changes
          if ($LASTEXITCODE -ne 0) {
            Write-Error "format check failed: $p (run dotnet format locally)"
            exit 1
          }
        }

    - name: Publish single-file
      run: dotnet publish -c Release -o publish --no-build

    - name: Stamp version into Inno Setup script
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        $p = "installer\EndfieldCharge.iss"
        (Get-Content $p) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$v`"" |
          Set-Content $p -Encoding UTF8
        Write-Host (Select-String -Path $p -Pattern 'MyAppVersion ')

    - name: Create portable zip
      shell: pwsh
      run: |
        $v = "${{ steps.ver.outputs.version }}"
        if (!(Test-Path "publish\EndfieldCharge.exe")) {
          Write-Error "publish\EndfieldCharge.exe not found"
          exit 1
        }
        # 外部插件必须随发版一起打进去（由 EndfieldCharge.csproj 的 CopyPluginsToPublish 产出）
        if (!(Test-Path "publish\plugins\EndfieldCharge.Plugin.Template.dll")) {
          Write-Error "publish\plugins\EndfieldCharge.Plugin.Template.dll not found —— 发版未带上插件"
          exit 1
        }
        # 必须包含 SkiaSharp native dll（libSkiaSharp / libHarfBuzzSharp / av_libglesv2），
        # 只打 exe 会导致启动即崩
        $stage = "EndfieldCharge-$v-portable"
        New-Item -ItemType Directory -Path $stage | Out-Null
        # -Recurse 不能省：publish\plugins\ 是子目录，不带 -Recurse 只会拷出空目录
        Copy-Item "publish\*" -Destination $stage -Exclude "*.pdb" -Recurse
        Compress-Archive -Path "$stage\*" -DestinationPath "$stage.zip"
        Remove-Item $stage -Recurse

    # Inno Setup 在 windows-latest 通常预装，缺失时用 choco 兜底
    - name: Ensure Inno Setup
      shell: pwsh
      run: |
        if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
          Write-Host "Inno Setup not found, installing via choco..."
          choco install innosetup -y --no-progress
        }
        iscc /? | Select-Object -First 1

    - name: Build installer
      shell: pwsh
      run: iscc "installer\EndfieldCharge.iss"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EndfieldCharge-${{ steps.ver.outputs.version }}
        path: |
          installer\Output\*.exe
          EndfieldCharge-*-portable.zip
        if-no-files-found: error

    # 手动发布：必须 workflow_dispatch + 勾选 publish_release + 运行在 v* 标签上
    # （标签由维护者手动创建；main 的 push 构建只出 Artifact，不会发布 Release）
    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch' && inputs.publish_release && startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: EndfieldCharge ${{ steps.ver.outputs.version }}
        generate_release_notes: true
        files: |
          installer\Output\*.exe
          EndfieldCharge-*-portable.zip
