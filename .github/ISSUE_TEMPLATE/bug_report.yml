name: Bug report
description: Something in the island, the settings, a plugin or the installer is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — the log excerpt and the
        Windows build number are usually what make a bug reproducible.

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About, or the installer / zip file name (e.g. 1.2.0)
      placeholder: 1.2.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How was it installed?
      options:
        - Installer (setup.exe)
        - Portable zip
        - Built from source
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      description: Output of `winver` (e.g. Windows 11 23H2, build 22631.4460)
      placeholder: Windows 11 23H2, build 22631.4460
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: Lines from %TEMP%\EndfieldCharge\log-YYYYMMDD.txt — especially ERROR / WARN
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Display scaling, HUD position and which island was shown, whether the app runs
        elevated (SMTC / music behaves differently), and whether the island was waiting,
        contracted or hidden when it happened.
    validations:
      required: false
